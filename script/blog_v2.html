<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Climate Professional Series | BLOG</title>
    <link rel="stylesheet" href="blog_zh_style.css">
    <link rel="stylesheet" href="common_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" type="image/x-icon" href="../img/cps_logo.png">
</head>
<body>
    <header id="main-header">
        <div class="header-container">
            <div class="logo-container">
                <a href="top_zh_index.html">
                    <img src="../img/cps_name_logo.png" alt="CPS Logo" id="logo-img">
                </a>
            </div>
            <nav class="desktop-menu">
                <ul>
                    <li><a href="top_zh_index.html"><span data-i18n="home">回首頁</span></a></li>
                    <li><a href="aboutus_zh_index.html"><span data-i18n="about">關於我們</span></a></li>
                    <li><a href="blog_v2.html" class="current-page"><span data-i18n="blog">部落格</span></a></li>
                </ul>
            </nav>
            <div class="right-controls">
                <a href="#" class="lang-switch">
                    <img src="../img/lang_en_icon.png" alt="Switch Language" id="lang-icon-img" style="width: 24px;">
                </a>
            </div>
        </div>
    </header>

    <div class="blog-container">
        <div class="blog-search-content">
            <h2 data-i18n="blog">氣候職人誌 部落格</h2>
            <div class="blog-sort-content">
                <div class="sort-dropdown">
                    <label for="series-select" data-i18n="selectSeries">選擇供稿社團</label>
                    <select id="series-select">
                        <option value="全部" data-i18n="all">全部</option>
                        <option value="NTUCA">NTUCA</option>
                        <option value="USSHKU">USSHKU</option>
                        <option value="NYCU-ESGSPC">NYCU-ESGSPC</option>
                    </select>
                </div>
                <div class="sort-dropdown">
                    <label for="sort-select" data-i18n="selectSort">選擇貼文排序方式</label>
                    <select id="sort-select">
                        <option value="default" data-i18n="defaultSort">預設排序</option>
                        <option value="date-desc" data-i18n="dateDesc">由新到舊</option>
                        <option value="date-asc" data-i18n="dateAsc">由舊到新</option>
                        <option value="likes" data-i18n="likesSort">按讚數</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="blog-posts-items-container" id="posts-container">
            <!-- 貼文將由 JS 動態渲染 -->
            <div class="loading">Loading posts...</div>
        </div>
    </div>

    <footer id="main-footer">
        <div class="footer-container">
            <p data-i18n="footerRights">© 2025 台大氣候行動社 NTUCA. All rights reserved.</p>
            <p data-i18n="footerAddr">106319 台北市大安區羅斯福路四段85號8樓</p>
        </div>
    </footer>

    <script type="module" src="blog_core.js"></script>
</body>
</html>
